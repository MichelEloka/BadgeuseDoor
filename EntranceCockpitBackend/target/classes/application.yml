server:
  port: 9500

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/badgeuse}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

events:
  interval: ${EVENTS_INTERVAL:PT4S}
  kafka:
    enabled: ${EVENTS_KAFKA_ENABLED:true}
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:}
    topic: ${KAFKA_TOPIC:entrance-events}
    additional-topic: ${KAFKA_TOPIC_ATTEMPTS:attempts}
    extra-topics: ${EVENTS_KAFKA_EXTRA_TOPICS:}
    group-id: ${KAFKA_GROUP_ID:entrance-cockpit}

logging:
  level:
    root: info
    com.example.entrance: debug
