services:
  entrance-cockpit-backend:
    build:
      context: ./EntranceCockpitBackend
    container_name: entrance-cockpit-backend
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://172.31.252.35:5432/coredb}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-coreuser}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-episen_tp_paas}
      EVENTS_KAFKA_ENABLED: ${EVENTS_KAFKA_ENABLED:-true}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-172.31.252.16:9092}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-entrance}
      KAFKA_TOPIC_ATTEMPTS: ${KAFKA_TOPIC_ATTEMPTS:-attempts}
      EVENTS_KAFKA_EXTRA_TOPICS: ${EVENTS_KAFKA_EXTRA_TOPICS:-logs}
    ports:
      - "9500:9500"
    restart: unless-stopped
