services:
  iotsimulator:
    build:
      context: ./iotsimulator
    image: badgeusedoor/iotbadgedoorsimulator
    container_name: iotBadgeDoorSimulateor
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_USER: toto
      MQTT_PASS: toto
      SIMULATOR_DATA_DIR: /data
    volumes:
      - ./iotsimulator/simulator_data:/data
    ports:
      - "9002:9002"
    restart: unless-stopped
