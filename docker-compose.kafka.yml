services:
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    restart: unless-stopped
    environment:
      - KAFKA_ENABLE_KRAFT=yes
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_NUM_PARTITIONS=1
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_DELETE_TOPIC_ENABLE=true
    ports:
      - "9092:9092"
    networks:
      - iot
    volumes:
      - kafka-data:/var/lib/kafka/data 
  kafka-init:
    image: apache/kafka:latest
    container_name: kafka-init
    depends_on:
      - kafka
    restart: "no"
    networks:
      - iot
    entrypoint: ["/bin/bash","-c"]
    command: >
      set -e;
      echo "[kafka-init] waiting for kafka:9092...";
      for i in {1..30}; do
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/tmp/kafka-ready 2>&1 && break;
        echo "[kafka-init] kafka not ready yet (attempt ${i}); sleep 2s"; sleep 2;
      done;
      echo "[kafka-init] ensuring topics";
      for t in logs entrance attempts; do
        echo "[kafka-init] create $t";
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$t" --partitions 1 --replication-factor 1 || true;
      done;
      echo "[kafka-init] topics:"; /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list

volumes:
  kafka-data:


